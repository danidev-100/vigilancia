services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilancia-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vigilancia
      POSTGRES_PASSWORD: vigilancia_dev
      POSTGRES_DB: vigilancia
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
